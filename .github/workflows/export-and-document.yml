name: ALM Export & Autodocumentation

on:
  workflow_dispatch:
    inputs:
      solution_name:
        description: 'Nombre de la Solución en Power Platform'
        required: true
        default: 'BizzSummitDemoALM'

jobs:
  export-unpack-document:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Permiso estricto requerido para el push automatizado del Action

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Instalar Power Platform Tools
        uses: microsoft/powerplatform-actions/actions-install@v1

      - name: Exportar Solución (Unmanaged)
        uses: microsoft/powerplatform-actions/export-solution@v1
        with:
          environment-url: ${{ vars.DATAVERSE_DEV_URL }}
          app-id: ${{ secrets.CLIENT_ID }}
          client-secret: ${{ secrets.CLIENT_SECRET }}
          tenant-id: ${{ secrets.TENANT_ID }}
          solution-name: ${{ inputs.solution_name }}
          solution-output-file: 'out/exported_solution.zip'

      - name: Desempaquetar Solución (Unpack)
        uses: microsoft/powerplatform-actions/unpack-solution@v1
        with:
          solution-file: 'out/exported_solution.zip'
          solution-folder: 'src/solutions/${{ inputs.solution_name }}'
          solution-type: 'Unmanaged'
          process-canvas-apps: true
          
      - name: Configurar entorno Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar dependencias de Python
        run: pip install requests

      - name: Generar Especificación Técnica con IA
        env:
          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_KEY: ${{ secrets.AZURE_OPENAI_KEY }}
          SOLUTION_NAME: ${{ inputs.solution_name }}
        run: python scripts/generate_docs.py

      - name: Hacer Commit y Push (Código y Documentación)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Mover el Markdown generado a la carpeta de la solución específica
          mv out/TECHNICAL_SPEC.md src/solutions/${{ inputs.solution_name }}/TECHNICAL_SPEC.md
          
          # Añadir el código fuente desempaquetado y la documentación técnica
          git add src/solutions/${{ inputs.solution_name }}/
          
          if git diff --staged --quiet; then
            echo "No se detectaron cambios en la solución o la documentación."
          else
            # El flag [skip ci] impide la recursividad infinita del pipeline
            git commit -m "build & docs: actualizar código fuente y autodocumentación [skip ci]"
            git push
          fi
